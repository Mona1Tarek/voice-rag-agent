[project]
name = "voice-rag-agent"
version = "0.1.0"
description = "A voice-enabled retrieval-augmented generation agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.30.0",
    "langchain-core>=1.6.13",
    "langchain-huggingface>=1.2.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.10",
    "peft>=0.21.2",
    "pypdf>=6.21.2",
    "pytesseract>=0.3.13",
    "pytest>=9.1.1",
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
    "ranx>=0.3.21",
    "sentence-transformers>=6.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/insurellm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
