[project]
name = "voice-rag-agent"
version = "0.1.0"
description = "A voice-enabled retrieval-augmented generation agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6.13",
    "pdfplumber>=0.11.10",
    "pypdf>=6.21.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/insurellm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
